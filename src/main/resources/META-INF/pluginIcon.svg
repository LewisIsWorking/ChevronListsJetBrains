<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Dark navy rounded background, matches the VS Code plugin galleryBanner colour -->
  <rect width="40" height="40" rx="6" ry="6" fill="#12122A"/>

  <!-- Row 1: > followed by line, purple -->
  <g fill="none" stroke="#A052E5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6,6 9,8.5 6,11"/>
  </g>
  <rect x="12" y="7.5" width="22" height="2" rx="1" ry="1" fill="#A052E5"/>

  <!-- Row 2: >> followed by line, lime -->
  <g fill="none" stroke="#88E532" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6,13 9,15.5 6,18"/>
    <polyline points="10,13 13,15.5 10,18"/>
  </g>
  <rect x="16" y="14.5" width="18" height="2" rx="1" ry="1" fill="#88E532"/>

  <!-- Row 3: >>> followed by line, blue -->
  <g fill="none" stroke="#5285E5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6,20 9,22.5 6,25"/>
    <polyline points="10,20 13,22.5 10,25"/>
    <polyline points="14,20 17,22.5 14,25"/>
  </g>
  <rect x="20" y="21.5" width="14" height="2" rx="1" ry="1" fill="#5285E5"/>

  <!-- Row 4: >>>> followed by line, lavender/light grey -->
  <g fill="none" stroke="#D8D8DC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6,27 9,29.5 6,32"/>
    <polyline points="10,27 13,29.5 10,32"/>
    <polyline points="14,27 17,29.5 14,32"/>
    <polyline points="18,27 21,29.5 18,32"/>
  </g>
  <rect x="24" y="28.5" width="10" height="2" rx="1" ry="1" fill="#D8D8DC"/>
</svg>